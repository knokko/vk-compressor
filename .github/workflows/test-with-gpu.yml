name: Testing the compressors that need a GPU to test (everything except BC7)

on: [push, pull_request]

jobs:
  test-swift-shader:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        jdk: [21, 25]
        os: [windows-2022, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: NcStudios/VulkanCI@v1.2
        with:
          sdkVersion: 1.4.309.0
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.jdk }}
          distribution: "zulu"
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test -p bc1
      - run: ./gradlew test -p bc4
      - run: ./gradlew test -p kim1
      - run: ./gradlew test -p kim2
      - run: ./gradlew test -p kim3
      - name: Store test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-jdk-${{ matrix.jdk }}
          path: ./**/build/reports

  test-lavapipe:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt update && sudo apt install mesa-vulkan-drivers libomp-dev -y
      - uses: actions/checkout@v7
      - run: curl https://sdk.lunarg.com/sdk/download/1.4.350.1/linux/vulkansdk-linux-x86_64-1.4.350.1.tar.xz > vulkan-sdk.tar.xz
      - run: tar -xJf vulkan-sdk.tar.xz
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
      - run: source ./1.4.350.1/setup-env.sh && ./gradlew test -p bc1
      - run: source ./1.4.350.1/setup-env.sh && ./gradlew test -p bc4
      - run: source ./1.4.350.1/setup-env.sh && ./gradlew test -p kim1
      - run: source ./1.4.350.1/setup-env.sh && ./gradlew test -p kim2
      - run: source ./1.4.350.1/setup-env.sh && ./gradlew test -p kim3
      - name: Store test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-lavapipe
          path: ./**/build/reports
      - name: Store JVM crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-crashes
          path: "**/hs_err_pid**"
