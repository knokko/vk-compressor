name: Testing the native BC7 compressor on all supported platforms

on: [push, pull_request]

jobs:
  test-without-docker:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        jdk: [ 21, 25 ]
        os: [ windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: "zulu"
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test -p bc7
      - name: Store test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-jdk-${{ matrix.jdk }}
          path: ./**/build/reports
      - name: Store JVM crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-crashes-${{ matrix.os }}-jdk-${{ matrix.jdk }}
          path: "**/hs_err_pid**"

  test-in-docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [ 21, 25 ]
    container:
      image: ubuntu
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: "zulu"
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test -p bc7
      - name: Store test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-docker
          path: ./**/build/reports
      - name: Store JVM crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-crashes-docker
          path: "**/hs_err_pid**"
